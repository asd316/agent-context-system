        "404": { $ref: "#/components/responses/NotFound" }

  /inbox/{reportId}/claim:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    post:
      tags: [agent-write]
      operationId: claimReport
      summary: 把 Report 标为 in-progress,记录 claimed_by
      x-cli:
        command: node-index inbox claim <id> --client ..
      description: |
        幂等: 已被同一 Client 认领时原样返回。已被其他 Client 认领,或已 resolved/rejected,退出码 4。
      parameters:
        - name: client
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: 更新后的 Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /inbox/{reportId}/resolve:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    post:
      tags: [agent-write]
      operationId: resolveReport
      summary: 填写 resolution,并向 shared/decisions.jsonl 追加一行
      x-cli:
        command: node-index inbox resolve <id> --status resolved|rejected --decided-by .. [--instruction <用户原话>] [--outcome as-proposed|modified|superseded] [--change <提交或文件>]... --by <client> [--session <会话 id>]
      description: |
        `--status resolved` 时 `--outcome` 必填且为 as-proposed 或 modified;`rejected` 时 `--outcome` 只能不带或为 `superseded` (被另一个决定整体取代,不是否定建议本身),且必须带 `--instruction` (驳回理由),否则退出码 2。
        Report 已是 resolved/rejected,或已被 `--by` 以外的 Client 认领 (in-progress),退出码 4。pending 的 Report 可不经 claim 直接处理。
        Decision 的 `result` 由 status 与 outcome 推出: rejected → rejected,rejected + superseded → superseded,as-proposed → approved,modified → modified。
        `--session` 默认取环境变量 `CLAUDE_CODE_SESSION_ID`;都没有时 Decision 不记 `session`。
        `action` 为 `resolve`;没有 `--instruction` 时 `note` 记 outcome 与 changes。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, decided_by, by]
              properties:
                status: { type: string, enum: [resolved, rejected] }
                decided_by: { type: string, minLength: 1 }
                instruction: { type: string }
                outcome: { $ref: "#/components/schemas/Outcome" }
                changes: { type: array, items: { type: string } }
                by: { type: string, minLength: 1 }
                session: { type: string, minLength: 1 }
      responses:
        "200":
          description: 更新后的 Report 与写入的 Decision
          content:
            application/json:
              schema:
                type: object
                required: [report, decision]
                properties:
                  report: { $ref: "#/components/schemas/Report" }
                  decision: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /lessons:
