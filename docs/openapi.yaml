                client: { type: string, minLength: 1 }
                situation: { type: string, minLength: 1 }
                problem: { type: string, minLength: 1 }
                fix: { type: string, minLength: 1 }
                host_only: { type: boolean, default: false }
      responses:
        "201":
          description: 新建的 Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/BadInput" }

