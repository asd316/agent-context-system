openapi: 3.1.0
info:
  title: node-index 操作契约
  version: 0.1.0
  description: |
    node-index 对外暴露的全部操作及其输入输出的契约,用来约束 CLI 实现与调用方 (干活 agent、维护 agent、人)。

    **这不是 HTTP 服务。** node-index 是本地命令行。这里借用 OpenAPI 的格式:
    - 每个 path + method 对应一条命令,命令行写在 `x-cli.command`。
    - 参数对应命令行参数;`--json` 时 stdout 必须符合 responses 里的 schema。
    - HTTP 状态码只是错误类别的标签,真实表现为进程退出码 (`x-cli.exit-codes`)。
    - 以后若要包一层 MCP 或 HTTP,直接复用这份契约。

    表结构以 `src/schema.sql` 为准;与本文冲突时,先对齐再改代码。

    本契约已于 2026-10-17 经用户确认定稿;改动需先与用户对齐,并同步更新 CLI 与 tests/test_contract.py。

    **P3 扩展 (2026-10-23)**: 按 agent-context-system 的 Data-Model 新增 Shared config 相关命令 (report、inbox、lesson、catalog、category、build、activate、apply) 与网页后端的 HTTP 接口 (`/api/...`)。原 `report` (覆盖率统计) 改名为 `coverage`。约定:
    - `x-unimplemented: true`: 契约已定、实现未到。tests/test_contract.py 跳过这些操作的「CLI 命令存在」与「目录限制」检查。实现某条命令时删掉这个标记,并在测试里补上它的调用参数与输出校验。
    - `x-http: true`: 真实的 HTTP 接口,由网页后端提供,不对应 CLI 命令,没有 `x-cli`。写接口与 CLI 调用同一批函数。
  x-cli:
    binary: node-index
    exit-codes:
      "0": 成功
      "2": 参数不合法 (400/422)
      "3": 对象不存在 (404)
      "4": 冲突,如成环、路径已被挂载 (409)
      "5": 不允许,如不在维护目录内执行写命令 (403)
      "6": 外部步骤失败,如 apply 的 git commit 失败 (500)
    global-flags:
      --json: 输出 JSON,否则输出人读文本 (tree 默认输出缩进文本)
      --db: 数据库文件路径,默认 ~/.local/share/node-index/index.db (环境变量 NODE_INDEX_DB 同效,命令行优先)
      --scope: 收录范围清单路径,默认 <仓库>/config/scope.yml。清单的 host_roots 为 true 时再接上 host/host.yml 的 scan_roots
      --no-count: get/children/ancestors 不累加访问计数 (环境变量 NODE_INDEX_NO_COUNT=1 同效)
servers:
  - url: cli://node-index
tags:
  - name: read
    description: 读命令。任何 agent 在任何目录都可执行,是写进全局提示词的唯一部分。get / children / ancestors 的唯一副作用是把访问事件追加到暂存文件,读命令本身不写库 (库不存在时新建空库除外);计数 (hits、last_access) 在 ingest-access 并入时才生效。追加失败不影响命令结果,search 与 tree 不计数。
  - name: write
    description: 写命令。只在仓库根目录内允许 (按当前工作目录判断),否则退出码 5。
  - name: maintenance
    description: 维护 agent 的批量动作,属于写命令。
  - name: agent-write
    description: agent 日常用的写命令 (report、lesson add、inbox claim、inbox resolve)。任何目录都可执行,写入 CLI 所在仓库的 shared/,与当前目录无关。
  - name: http
    description: 网页后端 (只监听 127.0.0.1) 的 HTTP 接口,见 x-http。

paths:
  /search:
    get:
      tags: [read]
      operationId: search
      summary: 关键词搜索,并返回每个命中节点所属的最上层节点
      x-cli:
        command: node-index search <query> [--limit N]
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: 搜索词。不少于 3 个字符走 FTS5 trigram;1–2 个字符走 LIKE 兜底。匹配 名称、层级摘要、内容摘要。
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 命中列表,可为空
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchHit" }
        "400": { $ref: "#/components/responses/BadInput" }

  /nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [read]
      operationId: getNode
      summary: 读取单个节点的全部字段
      x-cli:
        command: node-index get <id>
      responses:
        "200":
          description: 节点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [write]
      operationId: updateNode
      summary: 修改节点字段;修改路径会重新检查并把路径状态置为 ok
      x-cli:
        command: node-index set <id> [--name ..] [--category ..] [--hier-summary ..] [--content-summary ..] [--status ..] [--path ..] --actor human|ai
      description: |
        摘要来源规则: `actor=ai` 不得覆盖来源为 human 的摘要,否则退出码 4。
        写入的摘要超长时直接拒绝 (退出码 2),不自动截断。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdate" }
      responses:
        "200":
          description: 更新后的节点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [write]
      operationId: deleteNode
      summary: 删除节点
      x-cli:
        command: node-index rm <id> [--detach] --actor human|ai
      description: |
        节点仍有边时默认拒绝 (退出码 4);带 `detach` 才会先移除它的所有边。
        `actor=ai` 一律拒绝 (退出码 5)。
      parameters:
        - name: detach
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Actor"
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /nodes:
    post:
      tags: [write]
      operationId: createNode
      summary: 新建节点,可同时挂到若干父节点下
      x-cli:
        command: node-index add --name .. --category .. [--hier-summary ..] [--path ..] [--status ..] [--parent <id>]... --actor human|ai
      description: |
        `actor=ai` 创建的节点 `pending=true`;`actor=human` 为 false。
        指定 parents 时建立的边: actor=human 为 manual,actor=ai 记为 scan (表示非人工建立,可被 ai 日后调整)。
        指定 path 时,必须是磁盘上存在的文件或文件夹,路径种类自动判定;该路径已被其他节点挂载则退出码 4。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeCreate" }
      responses:
        "201":
          description: 新节点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /nodes/{id}/confirm:
    post:
      tags: [write]
      operationId: confirmNode
      summary: 确认待确认节点 (pending 置 false)
      x-cli:
        command: node-index confirm <id>
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 更新后的节点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{id}/confirm-subtree:
    post:
      tags: [write]
      operationId: confirmSubtree
      summary: 批量确认 (该节点及其全部后代的 pending 置 false)
      description: 用于按根、按目录审核。只改 pending,其余字段不变;已确认的节点不计入 confirmed。
      x-cli:
        command: node-index confirm <id> --subtree
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 确认结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [root, confirmed]
                properties:
                  root: { type: string, pattern: "^n[0-9]+$" }
                  confirmed: { type: integer, minimum: 0, description: 本次由待确认改为已确认的节点数 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{id}/children:
    get:
      tags: [read]
      operationId: listChildren
      summary: 展开一层子节点,按名称排序
      x-cli:
        command: node-index children <id>
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 子节点简要信息
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeBrief" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{id}/ancestors:
    get:
      tags: [read]
      operationId: listAncestorPaths
      summary: 列出从最上层节点到该节点的全部路径 (多父节点时可有多条)
      x-cli:
        command: node-index ancestors <id>
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 每条路径是自上而下的节点简要信息列表,最后一项是该节点自己
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items: { $ref: "#/components/schemas/NodeBrief" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tree:
    get:
      tags: [read]
      operationId: exportTree
      summary: 导出深度为 N 的树,供写入全局提示词
      x-cli:
        command: node-index tree --depth N [--root <id>] [--json]
      description: |
        默认输出缩进文本,每行格式:
        `<id> <名称> [📎] [⚠] — <层级摘要>`
        📎 表示有挂载物;⚠ 表示路径失效。缩进两个空格表示一层。
        同级按名称排序。一个节点有多个父节点时,只在字典序最先的父节点下完整展开,
        其他父节点下输出 `<id> <名称> → 见 <规范父节点 id>`,不再展开其子树。
        “字典序最先”按父节点的 (名称, id) 比较。若规范父节点不在本次导出的子树内,则在遇到的第一个位置完整展开。
        不带 `root` 时从所有最上层节点 (没有父节点的节点) 开始。深度 1 表示只含最上层节点自己。
        文本输出不含内容摘要。
      parameters:
        - name: depth
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 10 }
        - name: root
          in: query
          schema: { $ref: "#/components/schemas/NodeId" }
      responses:
        "200":
          description: 树
          content:
            text/plain:
              schema: { type: string }
              example: |
                n1 知识库 📎 — 我所有的笔记与设计资料
                  n2 设计 📎 — 设计原则与案例
                n10 Skill — 可复用的做事方法
                  n11 调研 — 各类调研方法
                    n12 调研视频 📎 — 看视频做调研的流程
                n20 项目 — 正在做的项目
                  n21 内容生产 — 内容产出类项目
                    n12 调研视频 → 见 n11
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TreeNode" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /coverage:
    get:
      tags: [read]
      operationId: coverage
      summary: 验收与维护状况统计 (2026-10-23 前命令名为 report)
      x-cli:
        command: node-index coverage [--json]
      description: |
        对照 scope.yml 扫描磁盘 (只读),用于检验“范围内、深度以内的每个路径至少被一个节点挂载,或被清单明确排除”。
      responses:
        "200":
          description: 统计
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }

  /edges:
    post:
      tags: [write]
      operationId: linkNodes
      summary: 建立父子边
      x-cli:
        command: node-index link <parent> <child> --actor human|ai
      description: 成环 (含自环) 退出码 4。`actor=human` 的边来源为 manual,`scan` 命令建立的边来源为 scan;`actor=ai` 经此命令建立的边不允许,请用 scan。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeRef" }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Edge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [write]
      operationId: unlinkNodes
      summary: 移除父子边
      x-cli:
        command: node-index unlink <parent> <child> --actor human|ai
      description: 来源为 manual 的边,`actor=ai` 不得移除 (退出码 5)。
      parameters:
        - name: parent
          in: query
          required: true
          schema: { $ref: "#/components/schemas/NodeId" }
        - name: child
          in: query
          required: true
          schema: { $ref: "#/components/schemas/NodeId" }
        - $ref: "#/components/parameters/Actor"
      responses:
        "204": { description: 已移除 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance/ingest-access:
    post:
      tags: [maintenance]
      operationId: ingestAccess
      summary: 把暂存文件里的访问事件并入数据库 (node_access 计数与 access_log 明细)
      x-cli:
        command: node-index ingest-access
      description: |
        读命令只把事件追加到暂存文件 (默认 /tmp/node-index-access.jsonl,环境变量 NODE_INDEX_SPOOL 可改;指定了非默认库时为 <库>.spool),
        不写库,以免读命令等待写锁。本命令是唯一的并入途径,由每日流水线第一步调用;并入前若库缺访问表 (老库) 会先补建。
        拿不到写锁或库只读时事件原样保留,返回 0。损坏的行跳过。
      responses:
        "200":
          description: 并入的事件数
          content:
            application/json:
              schema:
                type: object
                required: [ingested]
                properties:
                  ingested: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /maintenance/check:
    post:
      tags: [maintenance]
      operationId: checkPaths
      summary: 检查所有挂载路径是否仍存在,更新路径状态与检查时间
      x-cli:
        command: node-index check
      description: 只标记 (ok/missing),不删除节点,不自动提议新路径。
      responses:
        "200":
          description: 本次检查结果
          content:
            application/json:
              schema:
                type: object
                required: [checked, missing]
                properties:
                  checked: { type: integer }
                  missing:
                    type: array
                    items: { $ref: "#/components/schemas/NodeBrief" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /maintenance/scan:
    post:
      tags: [maintenance]
      operationId: scan
      summary: 按 scope.yml 扫描磁盘,为新增路径建立待确认节点
      x-cli:
        command: node-index scan [--dry-run]
      description: |
        只建节点和 scan 来源的边,不改已有节点。新节点 `pending=true`,类别继承所属根的类别,
        层级摘要为空,待维护 agent 补写。`dry-run` 只返回将会新建的内容。
      parameters:
        - name: dry-run
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 非 dry-run 时返回 created (已新建的节点);dry-run 时返回 would_create (将新建的内容,此时还没有 id)。二者只出现一个。
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items: { $ref: "#/components/schemas/NodeBrief" }
                  categories:
                    type: object
                    description: |
                      scope 含 shared/skills 根时才有: 把 shared/categories.yaml 写进本机库的结果。
                      每个 Category 一个无挂载物的 Skill 节点,挂在 shared/skills 根节点下,成员挂在它下面;
                      Category 节点的边以文件为准 (origin=scan)。unresolved 是找不到本机节点的成员 (`<category>: <member>`)。
                    required: [created, renamed, removed, linked, unlinked, unresolved]
                    properties:
                      created: { type: array, items: { $ref: "#/components/schemas/CategoryId" } }
                      renamed: { type: array, items: { $ref: "#/components/schemas/CategoryId" } }
                      removed: { type: array, items: { $ref: "#/components/schemas/CategoryId" } }
                      linked: { type: integer }
                      unlinked: { type: integer }
                      unresolved: { type: array, items: { type: string } }
                  would_create:
                    type: array
                    items:
                      type: object
                      required: [name, category, path, path_kind, parent_path]
                      properties:
                        name: { type: string }
                        category: { $ref: "#/components/schemas/Category" }
                        path: { type: string }
                        path_kind: { $ref: "#/components/schemas/PathKind" }
                        parent_path: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }

  /maintenance/render:
    post:
      tags: [maintenance]
      operationId: renderPromptDoc
      summary: 生成供 agent 加载的提示词文档 (树 + CLI 简要用法)
      x-cli:
        command: node-index render --depth N [--out <file>]
      description: |
        默认写入 ~/.local/share/node-index/ 下的生成文档,返回写入路径。
        文档的文字部分(标题、开头、命令说明、符号说明)读自 `config/prompt.yml`,缺失或格式不对时报 bad_input(exit 2),不回退到内置文字;树由数据库生成。
        内容与已有文件完全相同时**不重写文件** (保持修改时间不变,避免读取该文件的 agent 被无谓地重新注入),此时 `changed` 为 false。
      parameters:
        - name: depth
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 10 }
        - name: out
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                type: object
                required: [path, bytes]
                properties:
                  path: { type: string }
                  bytes: { type: integer }
                  changed: { type: boolean, description: 本次是否真的写了文件 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /maintenance/layer:
    post:
      tags: [maintenance]
      operationId: applyLayerPlan
      summary: 按分层方案文件批量建立分类节点并挂载已有节点
      x-cli:
        command: node-index layer --plan <plan.json> [--dry-run] [--detach]
      description: |
        读取分层方案 (plan 文件: root、groups、skills、可选 detach_from),建立
        「大类 → 子类 → 节点」。分类节点是**纯目录节点**: 不挂载文件,类别取自根节点,来源为 human (不待确认),层级摘要留空,事后由 `summarize` 生成。

        **根节点 `root` 有三种写法:**
        - 字符串: 名称,必须是库里恰有一个的、无父节点的节点 (否则退出码 2)。
        - `{"name": ..}`: 同上,但可再带 `create: {category, adopt_roots}`——名称不存在时**新建**这个根 (纯目录节点,类别取 `create.category`),并把 `adopt_roots` 列出的现有挂载节点 (按名称,且类别须与根相同,须各恰有一个) 挂到它下面。根已存在时只补建缺失的 adopt 边。
        - `{"path": ..}`: 以挂载该路径的节点为分层起点,它可以有父节点 (用于只给某个文件夹下的子节点分层)。

        **规则:**
        - 只有一个子类的大类不再建同名子类,节点直接挂大类。该判断依据方案里定义的子类数,不依据实际用到的数量。主分类为 `ZZ` 的节点不动。
        - 每个节点最多两条新边: 主分类与可选的次要分类,来源均为 manual。
        - 节点按名称查找: 先在根的直接子节点和各 `adopt_roots` 的直接子节点里找,找不到再到根的全部后代里找 (已被移走的情形)。找不到记入 skipped;同名多个则退出码 2。
        - `detach`: 对已被归类的节点,移除它与 `detach_from` 所列名称的父节点之间的原有边;方案没写 `detach_from` 时,移除它与根节点之间的边。未被归类的节点保持原样,仍在原父节点下。`--detach-root` 是它的旧写法,仍可用。
        - 幂等: 同一父节点下已有同名分类节点就复用;已存在的边不重复建。重跑不产生任何新节点或边。
        - `dry-run`: 不写库,返回将要发生的数量,不要求在维护目录内执行。预演与真实应用的数字必须一致。
        - 方案格式不合法、根或 adopt 节点找不到/不唯一、待归类节点重名,都在写入任何内容之前以退出码 2 拒绝,保证要么全部应用要么不动。
      parameters:
        - { name: plan, in: query, required: true, schema: { type: string } }
        - { name: dry-run, in: query, schema: { type: boolean, default: false } }
        - { name: detach, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: 应用结果 (dry-run 时数量为预计值;新建的根也计入 created_nodes,adopt 与分类挂载的边计入 linked)
          content:
            application/json:
              schema:
                type: object
                required: [created_nodes, linked, detached, skipped, dry_run]
                properties:
                  dry_run: { type: boolean }
                  created_nodes:
                    type: array
                    description: 新建 (dry-run 时为将新建) 的分类节点名,含其父节点名;新建的根其 parent 为空字符串
                    items:
                      type: object
                      required: [name, parent]
                      properties:
                        name: { type: string }
                        parent: { type: string }
                  linked: { type: integer, description: 新建的边数 }
                  detached: { type: integer, description: 被移除的旧边数 }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [name, reason]
                      properties:
                        name: { type: string }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /maintenance/summarize:
    post:
      tags: [maintenance]
      operationId: summarize
      summary: 调用 DeepSeek (OpenAI 兼容接口) 为节点生成层级摘要与内容摘要
      x-cli:
        command: node-index summarize [--ids n1,n2] [--limit N] [--force] [--dry-run] [--workers N] [--env <file>]
      description: |
        连接信息读自仓库根的 `.env` (OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL);密钥不会出现在任何输出里。
        目标: 层级摘要为空的节点;有挂载物但没有内容摘要或内容摘要已过期的节点。`force` 额外重写已有的 ai 摘要。
        SOP 文件 (`reference/sops/*.md`) 在内容摘要要重写、且层级摘要不是人写的时,同一次回复里的层级摘要一并写入,并在结果的 `sop_hier` 里列出。其他节点的已有层级摘要不因此重写。
        来源为 human 的摘要永远不覆盖。写入走与 `set --actor ai` 相同的校验: 层级摘要 ≤ 40 字、内容摘要 ≤ 200 字,
        超长则带反馈让模型重写,仍不合格就记入 failed,不截断。新生成的摘要来源记为 ai,节点的待确认状态不变。
        不设费用上限;`limit` 为 0 或不填表示不限 (未传 `--limit` 时读 .env 的 SUMMARY_MAX_PER_RUN,0 或缺省为不限)。
        内容摘要是否过期: 挂载物的"有效修改时间"晚于摘要记录的时间。文件的有效修改时间就是文件本身的修改时间;**文件夹**取「文件夹自身」与「其说明文档 (SKILL.md、README.md、README、AGENTS.md、CLAUDE.md 中存在的那些)」修改时间的最大值——因为改动文件夹里的文件不会改变文件夹自身的修改时间,只看后者会漏掉内容更新。`coverage` 的 `stale_content_summaries` 使用同一口径。
        每个节点写入后立即落库,中途中断可直接重跑,只会处理剩下的。
        `dry-run` 不需要 .env,不调用模型,不要求在维护目录内执行。
      parameters:
        - { name: ids, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0 } }
        - { name: force, in: query, schema: { type: boolean, default: false } }
        - { name: dry-run, in: query, schema: { type: boolean, default: false } }
        - { name: workers, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: 非 dry-run 返回 ok/failed/skipped;dry-run 返回 target_ids 与 sample_prompt
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets: { type: integer }
                  sop_hier:
                    type: array
                    description: 这次写入了层级摘要的 SOP 节点。每日流水线据此决定要不要 build。
                    items: { $ref: "#/components/schemas/NodeId" }
                  ok:
                    type: array
                    items: { $ref: "#/components/schemas/NodeId" }
                  failed:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id: { $ref: "#/components/schemas/NodeId" }
                        reason: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id: { $ref: "#/components/schemas/NodeId" }
                        reason: { type: string }
                  target_ids:
                    type: array
                    items: { $ref: "#/components/schemas/NodeId" }
                  sample_prompt: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance/snapshot:
    post:
      tags: [maintenance]
      operationId: writeSnapshot
      summary: 导出 JSONL 快照到仓库 snapshots/ 目录
      x-cli:
        command: node-index snapshot [--out <file>]
      description: 每个节点一行;边以 parents 数组附在节点行上。只用于备份与人工审阅。默认写 <仓库>/snapshots/<host>.jsonl,host 取 host/host.yml (不存在时退出码 2)。内容与已有文件完全相同时不重写文件,`changed` 为 false。
      parameters:
        - name: out
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                type: object
                required: [path, nodes]
                properties:
                  path: { type: string }
                  nodes: { type: integer }
                  changed: { type: boolean, description: 本次是否真的写了文件 }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- P3: Shared config 相关命令 ----

  /reports:
    post:
      tags: [agent-write]
      operationId: createReport
      summary: 新建一条 Report,写入 shared/inbox/<id>.yaml,status 为 pending
      x-cli:
        command: node-index report <kind> --title .. --reason .. --evidence .. --client .. --position orchestrator|executor [--target <path> (--diff <file|-> | --old <text> --new <text>)]
      description: |
        任何目录都可执行,写入本仓库的 shared/inbox/。`from.host` 取 host/host.yml 的 `host`;host.yml 不存在时退出码 2。
        带 `--target` 即为 Proposal,`change.diff` 取自 `--diff` 指定的文件 (`-` 为标准输入),或由 `--old`/`--new` 组成 `change.replace`。
        kind 为 `rule-change` 而没有 change,退出码 2。kind 为 `digest` 只由 Digest 生成,agent 不应手动使用。
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ReportKind" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, reason, evidence, client, position]
              properties:
                title: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
                evidence: { type: string, minLength: 1 }
                client: { type: string, minLength: 1 }
                position: { $ref: "#/components/schemas/Position" }
                change: { $ref: "#/components/schemas/ReportChange" }
      responses:
        "201":
          description: 新建的 Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadInput" }

  /inbox:
    get:
      tags: [read]
      operationId: listInbox
      summary: 列出 Report,按 at 倒序
      x-cli:
        command: node-index inbox list [--status pending|in-progress|resolved|rejected]... [--kind <kind>]
      description: 不带 `--status` 时列出 pending 与 in-progress。
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/ReportStatus" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ReportKind" }
      responses:
        "200":
          description: Report 摘要列表,可为空
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportBrief" }

  /inbox/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
