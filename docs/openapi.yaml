      operationId: activate
      summary: 按 host/host.yml 把各 Client 当前 Profile 的 Build 产物装进 Client
      x-cli:
        command: node-index activate [--client <name>]
      description: |
        规则文件复制写入 `rules_path` (原子替换,不用软链)。后缀为 `.mdc` 时在正文前加上
        `alwaysApply: true` 的 frontmatter,重复执行结果仍相同。`rules_path` 是软链时拒绝 (退出码 4),
        任何 Client 都不改: 写进去会改掉链接目标,由用户先换成普通文件。
        skill 软链进 `skills_dir`,Manual-only skill 按 `manual_only_mode` 处理 (`frontmatter` 装成一个目录:
        SKILL.md 是加了 `disable-model-invocation: true` 的副本,其余逐项软链到来源)。
        只管自己装的条目 (记录在 `host/activate-state.json`);同名的其他文件不动,列入 `conflicts`。
        Host 上没有的 skill 静默跳过并列入 `skipped`;Native skill 不装。`rules_path` 所在目录不存在的
        Client 整个跳过,列入 `skipped_clients`。`build/<profile>/` 不存在时退出码 2。重复执行结果相同。
      responses:
        "200":
          description: 激活结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivateResult" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /maintenance/apply:
    post:
      tags: [maintenance]
      operationId: apply
      summary: build → activate → commit → push,并把结果写入 host/ 下的状态文件
      x-cli:
        command: node-index apply [--no-push]
      description: |
        某一步失败即停在该步,不回滚已生效的配置,退出码 6。push 失败不算失败: `pushed=false`,退出码 0。
        没有可提交的改动时跳过 commit (`commit` 为 null)。只提交 `shared/`。
        每步结果写入 `host/apply-state.json` (形状同 ApplyStatus),供 `GET /api/apply/status`;
        已有一次在运行 (状态为 running 且进程存活) 时退出码 4。
      responses:
        "200":
          description: 各步结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Failed" }

  /maintenance/digest:
    post:
      tags: [maintenance]
      operationId: digest
      summary: Digest 最小版,检查 Category 归类与 Router skill 的 Selection guide,每条发现写成一条 digest Report
      x-cli:
        command: node-index digest [--dry-run] [--if-due] [--workers N] [--env <file>]
      description: |
        两类检查,每个检查单位一次模型调用 (连接信息同 summarize,读仓库根 `.env`,密钥不出现在输出里):
        `category-fit` 每个含 skill 成员的 Category 一个单位,判断其中每个 skill 的名字与内容是否符合该 Category 主题,
        发现按 skill 拆开;`router-guide` 每个有 Router 的 Category 一个单位,判断 Selection guide 与当前 Member list
        是否一致,模型给出修订稿时 Report 附 Proposal (`replace` 整段 Selection guide)。
        每条发现经 `inbox` 写成 `kind: digest` 的 Report (`from.client` 为 `node-index-digest`),reason 含具体建议
        (归类类给出 `category move|copy` 命令)。条目键写在 evidence 首行 `Digest 条目: <键>`
        (`category-fit:<category>:<skill>`、`router-guide:<router>`);同一条目已有未关闭的 digest Report 时不新建,
        列入 `duplicates`。模型回复不合格时带反馈重问,仍不合格列入 `failed`,命令仍退出 0。
        全部单位成功时把运行时间记入 `host/digest-state.json`;`--if-due` 时距上次不满 7 天就跳过 (`skipped: true`)。
        `--dry-run` 不需要 .env,不调用模型,不要求在维护目录内执行。host/host.yml 不存在时退出码 2。
      parameters:
        - { name: dry-run, in: query, schema: { type: boolean, default: false } }
        - { name: if-due, in: query, schema: { type: boolean, default: false } }
        - { name: workers, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: 运行结果;dry-run 返回 target_keys 与 sample_prompt;未到期返回 skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  skipped: { type: boolean }
                  next_due: { type: string }
                  last_run: { type: [string, "null"] }
                  targets: { type: integer }
                  target_keys: { type: array, items: { type: string } }
                  sample_prompt: { type: [string, "null"] }
                  reports:
                    type: array
                    items:
                      type: object
                      required: [id, key, title, proposal]
                      properties:
                        id: { $ref: "#/components/schemas/ReportId" }
                        key: { type: string }
                        title: { type: string }
                        proposal: { type: boolean }
                  duplicates: { type: array, items: { type: string } }
                  failed:
                    type: array
                    items:
                      type: object
                      required: [key, reason]
                      properties:
                        key: { type: string }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- P3: 网页后端的 HTTP 接口 (ui 的 server.py,只监听 127.0.0.1)。这一组是真实 HTTP,不对应 CLI 命令 ----

  /api/graph:
    get:
      tags: [http]
      operationId: httpGraph
      x-http: true
      summary: Explore 页的图数据 (形状见 ui/console/README.md)
      responses:
        "200":
          description: 节点与边
          content:
            application/json:
              schema: { type: object }

  /api/organize:
    get:
      tags: [http]
      operationId: httpOrganize
      x-http: true
      summary: Category 树与成员,合并 categories.yaml、catalog.yaml 与 Index 层级摘要
      responses:
        "200":
          description: Organize 页数据
          content:
            application/json:
              schema:
                type: object
                required: [categories, uncategorized]
                properties:
                  categories:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/SharedCategory"
                        - type: object
                          required: [member_details]
                          properties:
                            member_details:
                              type: array
                              items: { $ref: "#/components/schemas/RouterMember" }
                  uncategorized:
                    type: array
                    description: 不属于任何 Category 的 active Catalog entry 名称 (Router skill 除外)
                    items: { type: string }
                  entries:
                    type: object
                    description: 全部 Catalog entry,按名称索引,供成员行显示来源与 Manual-only
                    additionalProperties: { $ref: "#/components/schemas/CatalogEntry" }
                  recent:
                    type: array
                    description: |
                      新归类的成员: 最近 7 天内由提交加进某 Category、现在仍在其中的成员。取自 categories.yaml 的 git log,
                      跳过 apply 提交 (用户在网页上的改动经 apply 提交),所以剩下的是 agent 的归类。是否已看过由页面自己记。
                    items:
                      type: object
                      required: [member, category, commit, at]
                      properties:
                        member: { $ref: "#/components/schemas/MemberRef" }
                        category: { $ref: "#/components/schemas/CategoryId" }
                        commit: { type: string }
                        at: { type: string }
                  problems:
                    type: array
                    description: shared.cross_check 的跨文件不一致
                    items: { type: string }

  /api/category:
    post:
      tags: [http]
      operationId: httpCreateCategory
      x-http: true
      summary: 新建 Category,与 createCategory 同一函数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { $ref: "#/components/schemas/CategoryId" }
                name: { type: string, minLength: 1 }
                router: { type: [string, "null"] }
      responses:
        "201":
          description: 新建的 Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedCategory" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/category/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/CategoryId" }
    delete:
      tags: [http]
      operationId: httpDeleteCategory
      x-http: true
      summary: 删除空的 Category (catalog.delete_category);有成员或子 Category 时 409
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { $ref: "#/components/schemas/CategoryId" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/membership:
    post:
      tags: [http]
      operationId: httpMembership
      x-http: true
      summary: 移动、复制、移出成员,与 moveMember / copyMember / removeMember 同一批函数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op, member]
              properties:
                op: { type: string, enum: [move, copy, remove] }
                member: { $ref: "#/components/schemas/MemberRef" }
                from: { $ref: "#/components/schemas/CategoryId" }
                to: { $ref: "#/components/schemas/CategoryId" }
      responses:
        "200":
          description: 该成员现在所属的全部 Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/catalog/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    patch:
      tags: [http]
      operationId: httpPatchCatalog
      x-http: true
      summary: 改 Tier、Manual-only,与 setCatalogEntry 同一函数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                tier: { $ref: "#/components/schemas/Tier" }
                manual_only: { type: boolean }
      responses:
        "200":
          description: 修改后的条目
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/profiles:
    get:
      tags: [http]
      operationId: httpProfiles
      x-http: true
      summary: 激活表与各 Profile 预览 (含估算大小)
      responses:
        "200":
          description: Profiles 页数据
          content:
            application/json:
              schema:
                type: object
                required: [clients, profiles]
                properties:
                  clients:
                    type: array
                    items:
                      type: object
                      required: [client, profile, rules_path, skills_dir, installed, active_profile, current_bytes]
                      properties:
                        client: { type: string }
                        profile: { $ref: "#/components/schemas/Profile" }
                        rules_path: { type: string }
                        skills_dir: { type: string }
                        installed: { type: boolean, description: rules_path 所在目录存在;否则页面显示「本机未安装」(与 activate 跳过的判断相同) }
                        active_profile: { type: [string, "null"], description: rules_path 文件头里 build 写下的 profile,即 Client 实际在用的;读不出为 null }
                        current_bytes: { type: [integer, "null"], description: rules_path 现在的大小 }
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [profile, rules_bytes, skills, rules, error]
                      properties:
                        profile: { $ref: "#/components/schemas/Profile" }
                        rules_bytes: { type: integer, description: 按当前 Shared config 估算的规则文件大小 (与 build 同一渲染函数) }
                        error: { type: [string, "null"], description: 渲染失败的原因,此时 rules_bytes 为 0 }
                        skills: { type: array, items: { $ref: "#/components/schemas/ProfileSkill" } }
                        rules:
                          type: array
                          description: 该 Profile 包含的 Rule block
                          items:
                            type: object
                            required: [id, title, kind, order, bytes]
                            properties:
                              id: { $ref: "#/components/schemas/Slug" }
                              title: { type: string }
                              kind: { type: string, enum: [general, index, required-read, dispatch, maintenance] }
                              order: { type: integer }
                              bytes: { type: integer }

  /api/clients/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    patch:
      tags: [http]
      operationId: httpPatchClient
      x-http: true
      summary: 切换某 Client 的 Profile (写 host/host.yml,不自动 activate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: 修改后的 Client
          content:
            application/json:
              schema:
                type: object
                required: [client, profile]
                properties:
                  client: { type: string }
                  profile: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inbox:
    get:
      tags: [http]
      operationId: httpListInbox
      x-http: true
      summary: 与 listInbox 相同,查询参数 status (可重复)、kind;每项另带 proposal (是否带 change)
      responses:
        "200":
          description: Report 摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ReportBrief"
                    - type: object
                      required: [proposal]
                      properties:
                        proposal: { type: boolean }

  /api/inbox/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [http]
      operationId: httpShowReport
      x-http: true
      summary: 与 showReport 相同
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inbox/{reportId}/preview:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [http]
      operationId: httpPreviewReport
      x-http: true
      summary: Proposal 的改动预览
      description: |
        在临时目录里对目标文件的副本运行 inbox.apply_change (与批准同一函数),源文件不动。
        不匹配时 conflict 为原因。目标是 shared/categories.yaml 时 trees 给出前后两棵 Category 树。不是 Proposal 时各字段为 null。
      responses:
        "200":
          description: 预览
          content:
            application/json:
              schema:
                type: object
                required: [target, before, after, conflict, trees]
                properties:
                  target: { type: [string, "null"] }
                  before: { type: [string, "null"] }
                  after: { type: [string, "null"] }
                  conflict: { type: [string, "null"] }
                  trees:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [before, after]
                        properties:
                          before: { type: array, items: { $ref: "#/components/schemas/SharedCategory" } }
                          after: { type: array, items: { $ref: "#/components/schemas/SharedCategory" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inbox/{reportId}/instruction:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    post:
      tags: [http]
      operationId: httpCopyInstruction
      x-http: true
      summary: 「复制指令」的文字,即 inbox.copy_instruction(id, text);不改任何文件
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        "200":
          description: 指令
          content:
            application/json:
              schema:
                type: object
                required: [instruction]
                properties:
                  instruction: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/inbox/{reportId}/decide:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    post:
      tags: [http]
      operationId: httpDecideReport
      x-http: true
      summary: 用户在网页上直接批准或驳回,与 resolveReport 同一函数 (decided_by=user, outcome=as-proposed)
      description: |
        实现为 `node_index.inbox.decide(paths, id, decision, instruction)`,HTTP 层只做参数转换。
        **批准会应用 change**: Report 带 change 时,先把改动写进工作区的目标文件,再记 resolved / as-proposed,`resolution.changes` 为 `[target]`。
        `replace` 要求 `old` 在目标文件中恰好出现 1 次;`diff` 经 `git apply --check` 后应用 (只许改 target 一个文件,diff 头里的路径一律按 target 处理)。
        目标文件已变、不再匹配时返回 409,目标文件与 Report 都不改。之后的 Build / Activate 由「应用」完成,decide 不触发。
        驳回时 `instruction` 即理由,必填,否则 400。已是 resolved/rejected 返回 409;in-progress 的 Report 也可直接决定 (用户的决定优先于 agent 的认领)。
        Decision 的 `action` 为 `decide`,`by` 与 `decided_by` 都是 `user`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                instruction: { type: string }
      responses:
        "200":
          description: 更新后的 Report 与写入的 Decision
          content:
            application/json:
              schema:
                type: object
                required: [report, decision]
                properties:
                  report: { $ref: "#/components/schemas/Report" }
                  decision: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/changes:
    get:
      tags: [http]
      operationId: httpChanges
      x-http: true
      summary: 未应用改动,即 Git 工作区相对上次 apply 提交的差异
      responses:
        "200":
          description: 改动文件列表
          content:
            application/json:
              schema:
                type: object
                required: [base_commit, files]
                properties:
                  base_commit: { type: [string, "null"], description: 上次 apply 结束时的 HEAD (apply_status 的 head);从未 apply 为 null,此时对比当前 HEAD }
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, status]
                      properties:
                        path: { type: string }
                        status: { type: string, enum: [added, modified, deleted] }
                  clients:
                    type: array
                    description: host/host.yml 里 Profile 已改、尚未 activate 的 Client (host/ 不进 Git,单独算;未安装的不列)
                    items:
                      type: object
                      required: [client, profile, active_profile]
                      properties:
                        client: { type: string }
                        profile: { $ref: "#/components/schemas/Profile" }
                        active_profile: { type: [string, "null"] }

  /api/changes/discard:
    post:
      tags: [http]
      operationId: httpDiscardChanges
      x-http: true
      summary: 撤销未应用改动,把 shared/ 恢复到上次 apply 的提交
      description: 未跟踪的新文件删除;Profile 已改的 Client 改回它正在用的 Profile,记为 `host/host.yml#<client>`。应用期间 409。
      responses:
        "200":
          description: 被恢复的文件
          content:
            application/json:
              schema:
                type: object
                required: [discarded]
                properties:
                  discarded: { type: array, items: { type: string } }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/lessons:
    get:
      tags: [http]
      operationId: httpLessons
      x-http: true
      summary: 全部 Lesson,含正文三节,新的在前
      responses:
        "200":
          description: Lesson 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LessonFull" }
    post:
      tags: [http]
      operationId: httpLessonCreate
      x-http: true
      summary: 新建 Lesson,与 `lesson add` 同一函数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topic, client, situation, problem, fix]
              properties:
                topic: { type: string }
                client: { type: string }
                situation: { type: string }
                problem: { type: string }
                fix: { type: string }
                host_only: { type: boolean, description: true 时 host 记为本机 Host id }
      responses:
        "201":
          description: 新建的 Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonFull" }
        "400": { $ref: "#/components/responses/BadInput" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/lessons/{lessonId}:
    patch:
      tags: [http]
      operationId: httpLessonUpdate
      x-http: true
      summary: 改一条 Lesson。id、host、date 不变;改主题会改文件名;status 不是 merged 时 merged_into 清空
      parameters:
        - { name: lessonId, in: path, required: true, schema: { $ref: "#/components/schemas/LessonId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                topic: { type: string }
                client: { type: string }
                situation: { type: string }
                problem: { type: string }
                fix: { type: string }
                status: { $ref: "#/components/schemas/LessonStatus" }
                merged_into: { type: [string, "null"] }
      responses:
        "200":
          description: 改后的 Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonFull" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/decisions:
    get:
      tags: [http]
      operationId: httpDecisions
      x-http: true
      summary: Decision log 全部记录,新的在前
      responses:
        "200":
          description: Decision 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Decision" }

  /api/apply:
    post:
      tags: [http]
      operationId: httpApply
      x-http: true
      summary: 在后台线程启动 apply (push 到 origin);已有一次在跑时返回 409
      description: 应用期间其余写接口一律 409「正在应用」。
      responses:
        "202":
          description: 已启动
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyStatus" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/apply/status:
    get:
      tags: [http]
      operationId: httpApplyStatus
      x-http: true
      summary: 轮询当前步骤与结果
      responses:
        "200":
          description: 当前状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyStatus" }

components:
  parameters:
    NodeId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/NodeId" }
    Actor:
      name: actor
      in: query
      required: true
      description: 声明调用者是人还是 AI。用于摘要来源与手工边的保护规则,属于自我声明,不是安全边界。
      schema: { $ref: "#/components/schemas/Actor" }

    ReportId:
      name: reportId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ReportId" }

  schemas:
    NodeId:
      type: string
      pattern: "^n[0-9]+$"
      description: 显示形式的节点编号;编号来自自增整数,删除后不复用。
      examples: [n12]
    Category:
      type: string
      enum: [Reference, Knowledge, Project, Skill]
    Actor:
      type: string
      enum: [human, ai]
    PathKind:
      type: string
      enum: [file, dir]
    PathState:
      type: string
      enum: [ok, missing]
    Edge:
      type: object
      required: [parent, child, origin]
      properties:
        parent: { $ref: "#/components/schemas/NodeId" }
        child: { $ref: "#/components/schemas/NodeId" }
        origin:
          type: string
          enum: [scan, manual]
    EdgeRef:
      type: object
      required: [parent, child, actor]
      properties:
        parent: { $ref: "#/components/schemas/NodeId" }
        child: { $ref: "#/components/schemas/NodeId" }
        actor: { $ref: "#/components/schemas/Actor" }
    NodeBrief:
      type: object
      required: [id, name, category, hier_summary, mounted, path_state]
      properties:
        id: { $ref: "#/components/schemas/NodeId" }
        name: { type: string, minLength: 1 }
        category: { $ref: "#/components/schemas/Category" }
        hier_summary: { type: string, maxLength: 40 }
        mounted:
          type: boolean
          description: 是否有挂载物 (对应树里的 📎)
        path_state: { $ref: "#/components/schemas/PathState" }
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/NodeBrief"
        - type: object
          required: [roots]
          properties:
            roots:
              type: array
              description: 该节点向上能到达的所有最上层节点 (没有父节点的节点),去重
              items:
                type: object
                required: [id, name]
                properties:
                  id: { $ref: "#/components/schemas/NodeId" }
                  name: { type: string }
    Node:
      allOf:
        - $ref: "#/components/schemas/NodeBrief"
        - type: object
          required: [content_summary, path, path_kind, status, created_at, modified_at, pending, path_checked_at, hier_by, content_by, hits, last_access, parents]
          properties:
            content_summary:
              type: [string, "null"]
              maxLength: 200
              description: 仅有挂载物的节点可非空
            path:
              type: [string, "null"]
              description: 挂载物的绝对路径;全库唯一
            path_kind:
              oneOf:
                - { $ref: "#/components/schemas/PathKind" }
                - { type: "null" }
            status: { type: [string, "null"] }
            created_at: { type: string, description: "本地时间,格式 YYYY-MM-DDTHH:MM:SS,不含时区" }
            modified_at: { type: string, description: "同 created_at" }
            pending: { type: boolean }
            path_checked_at: { type: [string, "null"], description: "同 created_at" }
            hier_by:
              oneOf:
                - { $ref: "#/components/schemas/Actor" }
                - { type: "null" }
            content_by:
              oneOf:
                - { $ref: "#/components/schemas/Actor" }
                - { type: "null" }
            hits:
              type: integer
              minimum: 0
              description: 被 agent 读取 (get / children / ancestors) 的累计次数,是并入 (ingest-access) 后的值,不含本次读取。运行遥测,不进快照,写命令不改它
            last_access: { type: [string, "null"], description: "最近一次被读取的时间,同 created_at;从未被读取为 null" }
            parents:
              type: array
              items: { $ref: "#/components/schemas/Edge" }
    NodeCreate:
      type: object
      required: [name, category, actor]
      properties:
        name: { type: string, minLength: 1 }
        category: { $ref: "#/components/schemas/Category" }
        hier_summary: { type: string, maxLength: 40 }
        path: { type: string }
        status: { type: string }
        parents:
          type: array
          items: { $ref: "#/components/schemas/NodeId" }
        actor: { $ref: "#/components/schemas/Actor" }
    NodeUpdate:
      type: object
      minProperties: 2
      required: [actor]
      properties:
        name: { type: string, minLength: 1 }
        category: { $ref: "#/components/schemas/Category" }
        hier_summary: { type: string, maxLength: 40 }
        content_summary: { type: string, maxLength: 200 }
        status: { type: [string, "null"] }
        path: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
    TreeNode:
      type: object
      required: [id, name, hier_summary, mounted, path_state, children]
      properties:
        id: { $ref: "#/components/schemas/NodeId" }
        name: { type: string }
        hier_summary: { type: string, maxLength: 40 }
        mounted: { type: boolean }
        path_state: { $ref: "#/components/schemas/PathState" }
        see:
          oneOf:
            - { $ref: "#/components/schemas/NodeId" }
            - { type: "null" }
          description: 非空表示这是引用行,值是规范父节点的 id,该节点的完整子树在那个父节点下展开,children 为空
        children:
          type: array
          items: { $ref: "#/components/schemas/TreeNode" }
    Coverage:
      type: object
      required: [nodes, pending, missing, uncovered, stale_content_summaries]
      properties:
        nodes: { type: integer }
        pending: { type: integer, description: 待确认节点数 }
        missing: { type: integer, description: 路径失效节点数 }
        uncovered:
          type: array
          description: 范围内、深度以内,既没有节点挂载也未被排除的路径。为空即满足验收第 1 条。
          items: { type: string }
        stale_content_summaries:
          type: integer
          description: 挂载物修改时间晚于摘要记录时间的节点数
    # ---- P3 ----
    ReportId:
      type: string
      pattern: "^R-[0-9]{8}-[0-9a-f]{4}$"
      examples: [R-20200101-a3f9]
    LessonId:
      type: string
      pattern: "^L-[0-9]{8}-[0-9a-f]{4}$"
      examples: [L-20200101-0b7c]
    Slug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: Rule block、SOP 的 id
    CategoryId:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*$"
      examples: [design, design/motion]
    MemberRef:
      type: string
      minLength: 1
      description: "skill 名、sop:<id> 或 lesson:<id>"
      examples: [demo-skill, "sop:demo-sop", "lesson:L-20200101-0a1b"]
    ReportKind:
      type: string
      enum: [rule-change, index-issue, skill-issue, context-gap, other, digest]
    ReportStatus:
      type: string
      enum: [pending, in-progress, resolved, rejected]
    Position:
      type: string
      enum: [orchestrator, executor]
    Profile:
      type: string
      enum: [orchestrator, executor]
      description: 目前 Profile 与 Position 一一对应
    Outcome:
      type: string
      enum: [as-proposed, modified, superseded]
    DecisionResult:
      type: string
      enum: [approved, rejected, adopted, dismissed, modified, superseded]
      description: 依次对应 批准、驳回、采纳、否决、按意见修改、已取代
    Tier:
      type: string
      enum: [core, router, leaf]
    EntryKind:
      type: string
      enum: [vendored, referenced, native]
    EntryStatus:
      type: string
      enum: [active, retired]
    LessonStatus:
      type: string
      enum: [active, merged, obsolete]
    ReportChange:
      type: object
      required: [target]
      description: diff 与 replace 二者恰好有一个
      properties:
        target: { type: string, minLength: 1, description: 仓库内相对路径 }
        diff: { type: string, minLength: 1, description: 统一 diff }
        replace:
          type: object
          required: [old, new]
          properties:
            old: { type: string }
            new: { type: string }
      oneOf:
        - required: [diff]
        - required: [replace]
    ReportResolution:
      type: object
      required: [decided_by, instruction, outcome, changes, at]
      properties:
        decided_by: { type: string, minLength: 1 }
        instruction: { type: [string, "null"], description: 用户原话 }
        outcome:
          oneOf:
            - { $ref: "#/components/schemas/Outcome" }
            - { type: "null" }
          description: status 为 rejected 时为 null 或 superseded
        changes: { type: array, items: { type: string } }
        at: { type: string, description: "本地时间 ISO 8601" }
    ReportBrief:
      type: object
      required: [id, kind, title, status, at, claimed_by, decided_by]
      properties:
        id: { $ref: "#/components/schemas/ReportId" }
        kind: { $ref: "#/components/schemas/ReportKind" }
        title: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        at: { type: string }
        claimed_by: { type: [string, "null"] }
        decided_by: { type: [string, "null"], description: 关闭后为 resolution.decided_by,未关闭为 null }
    Report:
      type: object
      required: [id, kind, title, reason, evidence, from, at, change, status, claimed_by, resolution]
      properties:
        id: { $ref: "#/components/schemas/ReportId" }
        kind: { $ref: "#/components/schemas/ReportKind" }
        title: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        evidence: { type: string, minLength: 1 }
        from:
          type: object
          required: [client, position, host]
          properties:
            client: { type: string, minLength: 1 }
            position: { $ref: "#/components/schemas/Position" }
            host: { type: string, minLength: 1 }
        at: { type: string, description: "本地时间 ISO 8601" }
        change:
          oneOf:
            - { $ref: "#/components/schemas/ReportChange" }
            - { type: "null" }
        status: { $ref: "#/components/schemas/ReportStatus" }
        claimed_by: { type: [string, "null"] }
        resolution:
          oneOf:
            - { $ref: "#/components/schemas/ReportResolution" }
            - { type: "null" }
    Decision:
      type: object
      required: [at, target, action, result, by]
      description: shared/decisions.jsonl 的一行;instruction 与 note 至少一个
      properties:
        at: { type: string }
        target: { type: string, minLength: 1, description: Report id 或 Digest 条目 }
        action: { type: string, minLength: 1 }
        result: { $ref: "#/components/schemas/DecisionResult" }
        instruction: { type: string }
        note: { type: string }
        by: { type: string, minLength: 1, description: 执行者;做决定的人见 Report 的 resolution.decided_by }
        session: { type: string, minLength: 1, description: 执行者的会话 id,拿得到才记 }
      anyOf:
        - required: [instruction]
        - required: [note]
    Lesson:
      type: object
      required: [id, path, status, merged_into, host, client, date]
      properties:
        id: { $ref: "#/components/schemas/LessonId" }
        path: { type: string, description: 仓库内相对路径 }
        status: { $ref: "#/components/schemas/LessonStatus" }
        merged_into: { type: [string, "null"] }
        host: { type: [string, "null"] }
        client: { type: string }
        date: { type: string, format: date }
    LessonFull:
      allOf:
        - { $ref: "#/components/schemas/Lesson" }
        - type: object
          required: [topic, situation, problem, fix]
          properties:
            topic: { type: string, minLength: 1 }
            situation: { type: string, description: 正文「情境」一节 }
            problem: { type: string, description: 正文「问题」一节 }
            fix: { type: string, description: 正文「正确做法」一节 }
    CatalogEntry:
      type: object
      required: [name, entry, source, version, added, tier, manual_only, status]
      properties:
        name: { type: string, minLength: 1 }
        entry: { $ref: "#/components/schemas/EntryKind" }
        source: { type: string, minLength: 1 }
        version: { type: [string, "null"] }
        added: { type: string, format: date }
        tier: { $ref: "#/components/schemas/Tier" }
        manual_only: { type: boolean }
        status: { $ref: "#/components/schemas/EntryStatus" }
    SharedCategory:
      type: object
      description: shared/categories.yaml 中的一个 Category (不同于节点的类别 Category)
      required: [id, name, router, members]
      properties:
        id: { $ref: "#/components/schemas/CategoryId" }
        name: { type: string, minLength: 1 }
        router: { type: [string, "null"] }
        members: { type: array, items: { $ref: "#/components/schemas/MemberRef" } }
    Membership:
      type: object
      required: [member, categories]
      properties:
        member: { $ref: "#/components/schemas/MemberRef" }
        categories: { type: array, items: { $ref: "#/components/schemas/CategoryId" } }
    RouterMember:
      type: object
      required: [ref, kind, tier, trait]
      description: Router skill 的 members.yaml 每一项
      properties:
        ref: { $ref: "#/components/schemas/MemberRef" }
        kind: { type: string, enum: [skill, sop, lesson] }
        tier:
          oneOf:
            - { $ref: "#/components/schemas/Tier" }
            - { type: "null" }
          description: 只有 skill 有
        trait: { type: string, maxLength: 40 }
    ProfileSkill:
      type: object
      required: [name, manual_only]
      properties:
        name: { type: string }
        manual_only: { type: boolean }
        tier: { $ref: "#/components/schemas/Tier" }
    BuildResult:
      type: object
      required: [profiles, routers]
      properties:
        profiles:
          type: array
          items:
            type: object
            required: [profile, rules_path, bytes, skills, changed]
            properties:
              profile: { $ref: "#/components/schemas/Profile" }
              rules_path: { type: string }
              bytes: { type: integer }
              skills: { type: array, items: { $ref: "#/components/schemas/ProfileSkill" } }
              changed: { type: boolean }
        routers:
          type: array
          items:
            type: object
            required: [name, members, changed]
            properties:
              name: { type: string }
              members: { type: integer }
              changed: { type: boolean }
    ActivateResult:
      type: object
      required: [clients, skipped_clients]
      properties:
        clients:
          type: array
          items:
            type: object
            required: [client, profile, rules_path, rules_changed, linked, unlinked, skipped, conflicts]
            properties:
              client: { type: string }
              profile: { $ref: "#/components/schemas/Profile" }
              rules_path: { type: string }
              rules_changed: { type: boolean }
              linked: { type: array, items: { type: string } }
              unlinked: { type: array, items: { type: string } }
              skipped: { type: array, items: { type: string }, description: Host 上没有的 skill }
              conflicts: { type: array, items: { type: string }, description: skills_dir 里已有不归 activate 管的同名文件,未覆盖 }
        skipped_clients:
          type: array
          items:
            type: object
            required: [client, reason]
            properties:
              client: { type: string }
              reason: { type: string }
    ApplyStep:
      type: object
      required: [step, ok, detail]
      properties:
        step: { type: string, enum: [build, activate, commit, push] }
        ok: { type: boolean }
        detail: { type: string }
    ApplyResult:
      type: object
      required: [steps, commit, pushed]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/ApplyStep" } }
        commit: { type: [string, "null"] }
        pushed: { type: boolean }
        unpushed_reason: { type: [string, "null"], description: 未推送的原因;推送成功为 null }
    ApplyStatus:
      type: object
      required: [state, steps, commit, pushed, at]
      properties:
        state: { type: string, enum: [idle, running, done, failed] }
        steps: { type: array, items: { $ref: "#/components/schemas/ApplyStep" } }
        commit: { type: [string, "null"] }
        pushed: { type: boolean }
        at: { type: [string, "null"] }
        unpushed_reason: { type: [string, "null"], description: 非空即「未推送」 }
        head: { type: [string, "null"], description: apply 结束时的 HEAD,即 /api/changes 的 base_commit }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [bad_input, not_found, conflict, forbidden, failed]
        message: { type: string }

  responses:
    BadInput:
      description: 参数不合法,包括摘要超长、搜索词为空、路径不存在 (退出码 2)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 节点或边不存在 (退出码 3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 成环、路径已被其他节点挂载、ai 覆盖 human 摘要、节点仍有边 (退出码 4)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 不在维护目录内执行写命令,或 ai 执行被禁止的动作 (退出码 5)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Failed:
      description: 外部步骤失败,如 apply 中 build、activate 或 git commit 失败 (退出码 6)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
